name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Fetch bundled mihomo
        run: scripts/fetch-mihomo.sh
      - name: Fetch Xray test core
        run: scripts/fetch-xray.sh
      - name: Fetch Sparkle
        run: scripts/fetch-sparkle.sh
      - name: Build Network Extension
        run: scripts/build-network-extension.sh
      - name: Build
        run: cargo build --bins --features sparkle
      - name: Test Xray projection
        env:
          XRAY_BINARY: ${{ github.workspace }}/resources/xray/xray
        run: cargo test --lib xray::tests
      - name: Package Xray test artifact
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/xray-channel-1.6' }}
        run: GITHUB_ACTIONS= CODESIGN_ADHOC=1 scripts/package-xray-test.sh
      - name: Upload Xray test artifact
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/xray-channel-1.6' }}
        uses: actions/upload-artifact@v4
        with:
          name: myproxy-xray-channel-${{ github.run_number }}
          path: dist/xray-channel/*.zip
          if-no-files-found: error
