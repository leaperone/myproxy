name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish (e.g. v0.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    env:
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MYPROXY_HOST_DEVID_PROFILE: ${{ secrets.MYPROXY_HOST_DEVID_PROFILE }}
      MYPROXY_NETWORK_EXTENSION_DEVID_PROFILE: ${{ secrets.MYPROXY_NETWORK_EXTENSION_DEVID_PROFILE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Resolve version
        id: ver
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "invalid tag" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Require release credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            SPARKLE_ED_PRIVATE_KEY \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release secret is unavailable: ${name}" >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/myproxy-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/myproxy-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate_data="${CSC_LINK}"
          if [[ "${certificate_data}" == data:*base64,* ]]; then
            certificate_data="${certificate_data#*,}"
          fi
          printf '%s' "${certificate_data}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${CSC_KEY_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}" >/dev/null
          security list-keychains -d user -s "${keychain_path}"
          identity="$(security find-identity -v -p codesigning "${keychain_path}" | \
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "${identity}" ]]; then
            echo "CSC_LINK does not contain a valid Developer ID Application identity." >&2
            security find-identity -v -p codesigning "${keychain_path}"
            exit 1
          fi
          echo "Using ${identity}"
          {
            echo "CODESIGN_IDENTITY=${identity}"
            echo "MYPROXY_KEYCHAIN_PATH=${keychain_path}"
            echo "MYPROXY_CERTIFICATE_PATH=${certificate_path}"
          } >> "${GITHUB_ENV}"
      - name: Decode Network Extension profiles
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/myproxy-profiles"
          if [[ -n "${MYPROXY_HOST_DEVID_PROFILE:-}" && -n "${MYPROXY_NETWORK_EXTENSION_DEVID_PROFILE:-}" ]]; then
            printf '%s' "${MYPROXY_HOST_DEVID_PROFILE}" | base64 --decode > "${RUNNER_TEMP}/myproxy-profiles/host.provisionprofile"
            printf '%s' "${MYPROXY_NETWORK_EXTENSION_DEVID_PROFILE}" | base64 --decode > "${RUNNER_TEMP}/myproxy-profiles/network-extension.provisionprofile"
            echo "MYPROXY_HOST_DEVID_PROFILE_PATH=${RUNNER_TEMP}/myproxy-profiles/host.provisionprofile" >> "${GITHUB_ENV}"
            echo "MYPROXY_NETWORK_EXTENSION_DEVID_PROFILE_PATH=${RUNNER_TEMP}/myproxy-profiles/network-extension.provisionprofile" >> "${GITHUB_ENV}"
          else
            echo "MYPROXY_*_DEVID_PROFILE secrets are unset; the packaged system extension will not activate until they are provided."
          fi
      - name: Package Sparkle zip and appcast
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/release-macos.sh "$VERSION"
      - name: Publish GitHub Release
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          notes="macOS .app (Sparkle zip). v${VERSION} is a full install."
          if [[ "$VERSION" == "0.0.1" ]]; then
            notes="${notes} No previous release, so generate_appcast produced no delta."
          else
            notes="${notes} Incremental Sparkle deltas are attached when a previous zip is available."
          fi
          assets=("dist/myproxy-${VERSION}.sparkle.zip" "dist/appcast.xml")
          shopt -s nullglob
          for delta in dist/*.delta; do
            assets+=("$delta")
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "myproxy ${TAG}" --notes "$notes"
          fi
      - name: Remove temporary signing material
        if: always()
        run: |
          set +e
          keychain_path="${MYPROXY_KEYCHAIN_PATH:-${RUNNER_TEMP}/myproxy-signing.keychain-db}"
          certificate_path="${MYPROXY_CERTIFICATE_PATH:-${RUNNER_TEMP}/myproxy-developer-id.p12}"
          if [[ "${keychain_path}" == "${RUNNER_TEMP}"/* && -f "${keychain_path}" ]]; then
            security delete-keychain "${keychain_path}"
          fi
          if [[ "${certificate_path}" == "${RUNNER_TEMP}"/* && -f "${certificate_path}" ]]; then
            rm -f "${certificate_path}"
          fi
