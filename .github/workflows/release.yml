name: Release

on:
  push:
    tags: ["v*", "!v*-*"]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: nightly
        type: choice
        options: [prod, nightly]
      tag:
        description: "Prod only: existing version tag (e.g. v0.0.4)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: myproxy-release
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    env:
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MYPROXY_HOST_DEVID_PROFILE: ${{ secrets.MYPROXY_HOST_DEVID_PROFILE }}
      MYPROXY_NETWORK_EXTENSION_DEVID_PROFILE: ${{ secrets.MYPROXY_NETWORK_EXTENSION_DEVID_PROFILE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'prod' && inputs.tag || github.event_name == 'push' && github.ref || 'main' }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Resolve version
        id: ver
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            channel=prod
            tag="$GITHUB_REF_NAME"
          else
            channel="${DISPATCH_CHANNEL:-nightly}"
            tag="$DISPATCH_TAG"
          fi
          package_version=$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo.toml must contain the next target MAJOR.MINOR.PATCH version" >&2
            exit 1
          fi
          if [[ "$channel" == "prod" ]]; then
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Prod requires an existing vMAJOR.MINOR.PATCH tag" >&2
              exit 1
            fi
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${tag}^{commit}")"
            version="${tag#v}"
            if [[ "$version" != "$package_version" ]]; then
              echo "Prod tag must match Cargo.toml version" >&2
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; publish a new version instead of replacing it" >&2
              exit 1
            fi
          elif [[ "$channel" == "nightly" ]]; then
            version="${package_version}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            tag="v${version}"
          else
            echo "invalid channel" >&2
            exit 1
          fi
          {
            echo "channel=$channel"
            echo "tag=$tag"
            echo "version=$version"
            echo "build_number=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
      - name: Require release credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            SPARKLE_ED_PRIVATE_KEY \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release secret is unavailable: ${name}" >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/myproxy-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/myproxy-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate_data="${CSC_LINK}"
          if [[ "${certificate_data}" == data:*base64,* ]]; then
            certificate_data="${certificate_data#*,}"
          fi
          printf '%s' "${certificate_data}" | base64 --decode > "${certificate_path}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${CSC_KEY_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}" >/dev/null
          security list-keychains -d user -s "${keychain_path}"
          identity="$(security find-identity -v -p codesigning "${keychain_path}" | \
            sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "${identity}" ]]; then
            echo "CSC_LINK does not contain a valid Developer ID Application identity." >&2
            security find-identity -v -p codesigning "${keychain_path}"
            exit 1
          fi
          echo "Using ${identity}"
          {
            echo "CODESIGN_IDENTITY=${identity}"
            echo "MYPROXY_KEYCHAIN_PATH=${keychain_path}"
            echo "MYPROXY_CERTIFICATE_PATH=${certificate_path}"
          } >> "${GITHUB_ENV}"
      - name: Decode Network Extension profiles
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/myproxy-profiles"
          if [[ -n "${MYPROXY_HOST_DEVID_PROFILE:-}" && -n "${MYPROXY_NETWORK_EXTENSION_DEVID_PROFILE:-}" ]]; then
            printf '%s' "${MYPROXY_HOST_DEVID_PROFILE}" | base64 --decode > "${RUNNER_TEMP}/myproxy-profiles/host.provisionprofile"
            printf '%s' "${MYPROXY_NETWORK_EXTENSION_DEVID_PROFILE}" | base64 --decode > "${RUNNER_TEMP}/myproxy-profiles/network-extension.provisionprofile"
            echo "MYPROXY_HOST_DEVID_PROFILE_PATH=${RUNNER_TEMP}/myproxy-profiles/host.provisionprofile" >> "${GITHUB_ENV}"
            echo "MYPROXY_NETWORK_EXTENSION_DEVID_PROFILE_PATH=${RUNNER_TEMP}/myproxy-profiles/network-extension.provisionprofile" >> "${GITHUB_ENV}"
          else
            echo "MYPROXY_*_DEVID_PROFILE secrets are unset; the packaged system extension will not activate until they are provided."
          fi
      - name: Package Sparkle zip and appcast
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MYPROXY_BUILD_CHANNEL: ${{ steps.ver.outputs.channel }}
          MYPROXY_RELEASE_TAG: ${{ steps.ver.outputs.tag }}
          MYPROXY_BUILD_NUMBER: ${{ steps.ver.outputs.build_number }}
        run: scripts/release-macos.sh "$VERSION"
      - name: Validate release artifacts
        env:
          CHANNEL: ${{ steps.ver.outputs.channel }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build_number }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: python3 scripts/check-release-artifacts.py "$CHANNEL" "$VERSION" "$BUILD_NUMBER" "$TAG"
      - name: Publish GitHub Release
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          notes="macOS .app with Sparkle updates. Channel: ${CHANNEL}. Source: ${sha}."
          assets=("dist/myproxy-${VERSION}.sparkle.zip" "dist/appcast.xml")
          shopt -s nullglob
          for delta in dist/*.delta; do
            assets+=("$delta")
          done
          if [[ "$CHANNEL" == "nightly" ]]; then
            gh release create "$TAG" "${assets[@]}" --draft --prerelease --latest=false \
              --target "$sha" --title "myproxy Nightly ${VERSION}" --notes "$notes"
            gh release edit "$TAG" --draft=false --prerelease --latest=false
            # This prerelease is a feed pointer. Archives stay on immutable build tags.
            feed_notes="Latest Nightly: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            if gh release view nightly >/dev/null 2>&1; then
              gh release upload nightly dist/appcast.xml --clobber
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
                -f sha="$sha" -F force=true >/dev/null
              gh release edit nightly --prerelease --latest=false --notes "$feed_notes"
            else
              gh release create nightly dist/appcast.xml --target "$sha" --prerelease --latest=false \
                --title "myproxy Nightly update channel" --notes "$feed_notes"
            fi
          else
            gh release create "$TAG" "${assets[@]}" --draft --target "$sha" \
              --title "myproxy ${TAG}" --notes "$notes"
            gh release edit "$TAG" --draft=false --latest
          fi
      - name: Remove temporary signing material
        if: always()
        run: |
          set +e
          keychain_path="${MYPROXY_KEYCHAIN_PATH:-${RUNNER_TEMP}/myproxy-signing.keychain-db}"
          certificate_path="${MYPROXY_CERTIFICATE_PATH:-${RUNNER_TEMP}/myproxy-developer-id.p12}"
          if [[ "${keychain_path}" == "${RUNNER_TEMP}"/* && -f "${keychain_path}" ]]; then
            security delete-keychain "${keychain_path}"
          fi
          if [[ "${certificate_path}" == "${RUNNER_TEMP}"/* && -f "${certificate_path}" ]]; then
            rm -f "${certificate_path}"
          fi
