[package]
name = "myproxy"
version = "0.1.0"
edition = "2021"
description = "GPUI controller for a bundled mihomo core"
publish = false

[lib]
name = "myproxy"
path = "src/lib.rs"

[[bin]]
name = "myproxy"
path = "src/main.rs"

[[bin]]
name = "myproxyctl"
path = "src/bin/myproxyctl.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
gpui-kit = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = "2"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
tray-icon = { version = "0.21", default-features = false }
